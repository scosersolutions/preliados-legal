<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Preliados &middot; Recuperar contrase&ntilde;a</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0B0714;
    --surface: #1A1128;
    --border: #2E2340;
    --text: #F2ECEF;
    --muted: #B4AAB2;
    --primary: #8B5CF6;
    --accent: #F472B6;
    --ok: #34D399;
    --danger: #F87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .card {
    width: 100%;
    max-width: 26rem;
    background: var(--surface);
    border-radius: 1.25rem;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .bar { height: 6px; background: linear-gradient(90deg, var(--primary), #EC4899); }
  .body { padding: 2.25rem 1.75rem; text-align: center; }
  .brand {
    font-size: .78rem; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: .35rem;
  }
  h1 { margin: .4rem 0 0; font-size: 1.5rem; line-height: 1.25; }
  p { margin: .8rem 0 0; color: var(--muted); font-size: .95rem; }
  .mark { font-size: 3rem; line-height: 1; }
  label { display: block; margin: 1.4rem 0 .35rem; text-align: left; font-size: .85rem; color: var(--muted); }
  input {
    width: 100%; padding: .8rem .9rem; border-radius: .7rem; font-size: 1rem;
    background: #150E22; border: 1px solid var(--border); color: var(--text);
  }
  input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  button {
    width: 100%; margin-top: 1.2rem; padding: .9rem 1rem; border: 0; cursor: pointer;
    border-radius: 999px; font-size: 1rem; font-weight: 700; color: #fff;
    background: linear-gradient(90deg, var(--primary), #EC4899);
  }
  button[disabled] { opacity: .55; cursor: default; }
  .pw { position: relative; }
  .pw input { padding-right: 3rem; }
  .eye {
    position: absolute; right: .35rem; bottom: .35rem;
    width: 2.6rem; height: 2.6rem; padding: 0; margin: 0;
    display: flex; align-items: center; justify-content: center;
    background: none; border: 0; border-radius: .6rem; cursor: pointer;
    color: var(--muted);
  }
  .eye:hover { color: var(--text); }
  .eye svg { width: 1.35rem; height: 1.35rem; }
  .msg { margin-top: 1rem; font-size: .9rem; min-height: 1.2rem; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--ok); }
  .link { display: inline-block; margin-top: 1.2rem; color: var(--muted); font-size: .8rem; }
  footer { padding: 0 1.75rem 1.75rem; text-align: center; font-size: .72rem; color: #6B6180; }
  footer a { color: #8B819C; }
  .hidden { display: none; }
</style>
<style>
  a.marca-inicio { text-decoration: none; color: inherit; display: inline-block; }
  a.marca-inicio:hover { opacity: .75; }
  .marca-legal { margin: 0 0 1.25rem; }
  .marca-legal a {
    text-decoration: none; font-size: .78rem; letter-spacing: .18em;
    text-transform: uppercase; font-weight: 700; color: var(--accent);
  }
  .marca-legal a:hover { opacity: .75; }
</style>
</head>
<body>
<div class="card">
  <div class="bar"></div>
  <div class="body">
    <a class="marca-inicio" href="/"><div class="brand">Preliados</div></a>
    <div class="mark" id="mark">&#128273;</div>
    <h1 id="title">Recuperar contrase&ntilde;a</h1>
    <p id="lead">Escribe tu correo y te enviamos un enlace para elegir una nueva.</p>

    <form id="requestForm">
      <label for="email">Correo</label>
      <input id="email" type="email" autocomplete="email" required placeholder="tu@correo.com">
      <button id="requestBtn" type="submit">Enviar enlace</button>
    </form>

    <form id="resetForm" class="hidden">
      <label for="pw1">Contrase&ntilde;a nueva</label>
      <div class="pw"><input id="pw1" type="password" autocomplete="new-password" minlength="8" required placeholder="M&iacute;nimo 8 caracteres"><button type="button" class="eye" id="eye-pw1" aria-label="Mostrar contrase&ntilde;a" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg></button></div>
      <label for="pw2">Repite la contrase&ntilde;a</label>
      <div class="pw"><input id="pw2" type="password" autocomplete="new-password" minlength="8" required placeholder="Escr&iacute;bela otra vez"><button type="button" class="eye" id="eye-pw2" aria-label="Mostrar contrase&ntilde;a" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg></button></div>
      <button id="resetBtn" type="submit">Guardar contrase&ntilde;a</button>
    </form>

    <div id="done" class="hidden">
      <button id="open" type="button">Abrir Preliados</button>
    </div>

    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </div>
  <footer>
    <a href="/legal/privacidad">Privacidad</a> &middot; <a href="/legal/condiciones">Condiciones</a><br>
    Solo para mayores de 18 a&ntilde;os.
  </footer>
</div>
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // Clave anonima: es publica por diseno y ya viaja dentro de la app. Lo que
  // protege los datos son las politicas RLS del servidor, no ocultar esto.
  //
  // FLUJO IMPLICITO, NO PKCE, Y ES LA CLAVE DE QUE ESTO FUNCIONE
  //
  // PKCE guarda un verificador en el navegador que PIDE el enlace y exige que
  // sea ese mismo el que lo canjee. Suena razonable hasta que lo pruebas: pides
  // el enlace en Chrome, abres el correo en Gmail, y Gmail lo abre en SU visor
  // interno — otro almacen, sin verificador. Resultado: "enlace caducado" en un
  // enlace recien nacido. Es lo que pasaba.
  //
  // El flujo implicito devuelve el token en el fragmento de la URL, asi que el
  // enlace vale en cualquier navegador. A cambio el token viaja en la URL, pero
  // no sale del dispositivo (los fragmentos no se envian al servidor), caduca
  // en una hora y sirve para una sola cosa: elegir contrasena nueva.
  const supabase = createClient("https://lnrvbmwsfffylnjogftc.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxucnZibXdzZmZmeWxuam9nZnRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NTM1NzEsImV4cCI6MjEwMTIyOTU3MX0.iHrz2HfjADjlQXo4zC0O0_2iEgPnPOmERKLGQZYwMQQ", {
    auth: { flowType: "implicit", detectSessionInUrl: true, persistSession: false },
  });

  const $ = (id) => document.getElementById(id);
  const msg = $("msg");
  const say = (text, kind) => { msg.textContent = text; msg.className = "msg " + (kind || ""); };

  function showResetForm() {
    $("requestForm").classList.add("hidden");
    $("resetForm").classList.remove("hidden");
    $("title").textContent = "Elige una contrasena nueva";
    $("lead").textContent = "Escribela dos veces para evitar erratas.";
    say("");
  }

  function showExpired() {
    $("mark").innerHTML = "&#9888;&#65039;";
    $("title").textContent = "Enlace caducado";
    $("lead").textContent = "Los enlaces valen una hora y un solo uso. Pide otro aqui mismo.";
    $("requestForm").classList.remove("hidden");
  }

  // Si venimos del correo, el token llega en el fragmento y supabase-js lo
  // convierte en sesion antes de emitir este evento.
  supabase.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY" || (event === "SIGNED_IN" && session)) showResetForm();
  });

  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("error_description")) {
    showExpired();
  } else if (hash.get("access_token")) {
    // Respaldo por si el evento ya se emitio antes de registrar el listener.
    const { data } = await supabase.auth.getSession();
    if (data.session) showResetForm();
  }

  // Espera obligatoria tras enviar. Sin ella, quien no ve llegar el correo al
  // instante pulsa cinco veces, se come el limite de envios de Supabase y
  // acaba sin poder pedirlo en un buen rato — justo lo contrario de lo que
  // buscaba.
  const RESEND_WAIT_SECONDS = 30;

  function startCooldown() {
    let left = RESEND_WAIT_SECONDS;
    const button = $("requestBtn");
    button.disabled = true;
    const label = () => { button.textContent = "Espera " + left + " s"; };
    label();
    const timer = setInterval(() => {
      left -= 1;
      if (left <= 0) {
        clearInterval(timer);
        button.disabled = false;
        button.textContent = "Enviar enlace";
        return;
      }
      label();
    }, 1000);
  }

  $("requestForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("requestBtn").disabled = true;
    say("Enviando...");
    const { error } = await supabase.auth.resetPasswordForEmail($("email").value.trim(), {
      redirectTo: location.origin + location.pathname,
    });
    // Se responde igual exista o no la cuenta: decir "ese correo no esta
    // registrado" convierte esta pagina en un oraculo de quien tiene cuenta.
    if (error) {
      $("requestBtn").disabled = false;
      say("No hemos podido enviarlo. Intentalo en unos minutos.", "err");
      return;
    }
    say("Si ese correo tiene cuenta, ya te hemos escrito. Revisa tambien el spam.", "ok");
    startCooldown();
  });

  $("resetForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    if ($("pw1").value !== $("pw2").value) {
      return say("Las dos contrasenas no son iguales. Revisalas y vuelve a intentarlo.", "err");
    }
    if ($("pw1").value.length < 8) {
      return say("La contrasena necesita al menos 8 caracteres.", "err");
    }
    $("resetBtn").disabled = true;
    say("Guardando...");
    const { error } = await supabase.auth.updateUser({ password: $("pw1").value });
    if (error) {
      $("resetBtn").disabled = false;
      const detail = (error.message || "").toLowerCase();
      // "Debe ser distinta de la anterior" se cuenta SIN decir que la escrita
      // es la que ya tenia: eso confirmaria una contrasena a cualquiera que
      // tuviera el enlace en la mano. Se pide otra, y punto.
      if (detail.includes("different from the old")) {
        return say("Elige una contrasena que no hayas usado antes en esta cuenta.", "err");
      }
      if (detail.includes("weak") || detail.includes("pwned") || detail.includes("compromis")) {
        return say("Esa contrasena es demasiado facil de adivinar. Prueba con otra mas larga.", "err");
      }
      if (detail.includes("expired") || detail.includes("session") || detail.includes("jwt")) {
        return say("El enlace ha caducado. Pide otro y vuelve a intentarlo.", "err");
      }
      return say("No se ha podido guardar. Pide un enlace nuevo e intentalo otra vez.", "err");
    }
    $("resetForm").classList.add("hidden");
    $("mark").innerHTML = "&#9989;";
    $("title").textContent = "Contrasena actualizada";
    $("lead").textContent = "Ya puedes entrar en Preliados con la nueva.";
    $("done").classList.remove("hidden");
    say("");
    await supabase.auth.signOut();
  });

  // Un ojo por campo, no uno compartido: si ensenar la contrasena ensenara
  // tambien la repetida, compararlas a ojo —que es para lo que esta el segundo
  // campo— dejaria de servir de nada.
  const EYE_OPEN = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>`;
  const EYE_OFF = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.5-6 10-6c1.6 0 3 .36 4.24.93M22 12s-3.5 6-10 6c-1.6 0-3-.36-4.24-.93" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  for (const field of ["pw1", "pw2"]) {
    const button = $("eye-" + field);
    button.addEventListener("click", () => {
      const input = $(field);
      const shown = input.type === "text";
      input.type = shown ? "password" : "text";
      button.innerHTML = shown ? EYE_OPEN : EYE_OFF;
      button.setAttribute("aria-label", shown ? "Mostrar contrase\u00f1a" : "Ocultar contrase\u00f1a");
      button.setAttribute("aria-pressed", String(!shown));
      input.focus();
    });
  }

  $("open").addEventListener("click", () => { location.href = "preliados://auth-callback"; });
</script>
</body>
</html>
