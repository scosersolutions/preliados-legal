<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preliados &middot; P&aacute;gina no encontrada</title>
<style>
  :root { color-scheme: dark; --bg:#0B0714; --surface:#1A1128; --text:#F2ECEF; --muted:#B4AAB2; --primary:#8B5CF6; --accent:#F472B6; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:1.5rem; background:var(--bg); color:var(--text); line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .card { width:100%; max-width:30rem; background:var(--surface); border-radius:1.25rem; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.45); }
  .bar { height:6px; background:linear-gradient(90deg,var(--primary),#EC4899); }
  .body { padding:2.5rem 1.75rem; text-align:center; }
  .mark { font-size:3rem; line-height:1; }
  .brand { font-size:.78rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  h1 { margin:.5rem 0 0; font-size:1.6rem; }
  p { margin:.9rem 0 0; color:var(--muted); font-size:.95rem; }
  .links { margin-top:1.6rem; display:flex; flex-direction:column; gap:.6rem; }
  .links a {
    display:block; padding:.85rem 1rem; border-radius:.8rem; text-decoration:none;
    background:#150E22; border:1px solid #2E2340; color:var(--text); font-weight:600; font-size:.95rem;
  }
  .links a:hover { border-color:var(--primary); }
  footer { padding:0 1.75rem 1.75rem; text-align:center; font-size:.72rem; color:#6B6180; }
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0B0714">
<style>
  body { position: relative; isolation: isolate; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(42rem 32rem at 8% -6%, rgba(139,92,246,.55), transparent 62%),
      radial-gradient(38rem 30rem at 102% 108%, rgba(236,72,153,.45), transparent 62%),
      radial-gradient(26rem 20rem at 92% 12%, rgba(244,114,182,.20), transparent 70%),
      radial-gradient(rgba(255,255,255,.09) 1px, transparent 1.2px) 0 0 / 22px 22px,
      #0B0714;
  }
  .card { box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(139,92,246,.18), 0 0 80px rgba(139,92,246,.18); }
</style>
</head>
<body>
<div class="card">
  <div class="bar"></div>
  <div class="body">
    <div class="mark">&#129300;</div>
    <div class="brand">Error 404</div>
    <h1>Esta p&aacute;gina no existe</h1>
    <p>Puede que el enlace sea antiguo o est&eacute; mal escrito. Prueba con alguno de estos.</p>    <div class="links">
      <a href="/">Inicio</a>
      <a href="/soporte">Ayuda y contacto</a>
      <a href="/cuenta">Gesti&oacute;n de cuenta</a>
      <a href="/legal/">Documentos legales</a>
    </div>
  </div>
  <footer>Preliados &middot; Solo para mayores de 18 a&ntilde;os.</footer>
</div>
</body>
</html>
