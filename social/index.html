<!DOCTYPE html>

<title>Redes &middot; Preliados</title>

<style>
  :root { color-scheme: dark; --bg:#0B0714; --surface:#1A1128; --surface2:#150E22; --text:#F2ECEF; --muted:#B4AAB2; --primary:#8B5CF6; --accent:#F472B6; --line:#2E2340; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:1.5rem; background:var(--bg); color:var(--text); line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .card { width:100%; max-width:30rem; background:var(--surface); border-radius:1.25rem; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.45); }
  .bar { height:6px; background:linear-gradient(90deg,var(--primary),#EC4899); }
  .body { padding:2.5rem 1.75rem; text-align:center; }
  .mark { font-size:3rem; line-height:1; }
  .brand { font-size:.78rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  h1 { margin:.5rem 0 0; font-size:1.6rem; }
  p { margin:.9rem 0 0; color:var(--muted); font-size:.95rem; }
  .links { margin-top:1.6rem; display:flex; flex-direction:column; gap:.6rem; }
  .links a {
    display:block; padding:.85rem 1rem; border-radius:.8rem; text-decoration:none;
    background:var(--surface2); border:1px solid var(--line); color:var(--text); font-weight:600; font-size:.95rem;
  }
  .links a:hover { border-color:var(--primary); }
  .redes { margin-top:1.6rem; display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
  .red {
    display:flex; flex-direction:column; align-items:center; gap:.55rem; padding:1.4rem .75rem 1.1rem;
    border-radius:1rem; text-decoration:none; color:#fff; font-weight:700; font-size:1rem;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .red:hover { transform:translateY(-3px); box-shadow:0 14px 30px rgba(0,0,0,.4); }
  .red svg { width:2.4rem; height:2.4rem; fill:currentColor; }
  .red small { font-weight:500; font-size:.8rem; opacity:.85; }
  .red.ig { background:linear-gradient(135deg,#FEDA75 0%,#FA7E1E 25%,#D62976 50%,#962FBF 75%,#4F5BD5 100%); }
  .red.tt { background:#000; border:1px solid #2E2340; box-shadow:inset 3px 0 0 #25F4EE, inset -3px 0 0 #FE2C55; }
  .sep { margin:1.8rem 0 0; font-size:.85rem; }
  footer { padding:0 1.75rem 1.75rem; text-align:center; font-size:.72rem; color:#6B6180; }
  footer a { color:#8478A0; }
</style>
<style>
  a.marca-inicio { text-decoration: none; color: inherit; display: inline-block; }
  a.marca-inicio:hover { opacity: .75; }
  .marca-legal { margin: 0 0 1.25rem; }
  .marca-legal a {
    text-decoration: none; font-size: .78rem; letter-spacing: .18em;
    text-transform: uppercase; font-weight: 700; color: var(--accent);
  }
  .marca-legal a:hover { opacity: .75; }
</style>
<link rel="icon" href="/favicon.ico" sizes="any">

<style>

  }
  .card { box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(139,92,246,.18), 0 0 80px rgba(139,92,246,.18); }
</style>
