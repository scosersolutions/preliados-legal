<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preliados</title>
<style>
  :root { color-scheme: dark; --bg:#0B0714; --surface:#1A1128; --text:#F2ECEF; --muted:#B4AAB2; --primary:#8B5CF6; --accent:#F472B6; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:1.5rem; background:var(--bg); color:var(--text); line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .card { width:100%; max-width:30rem; background:var(--surface); border-radius:1.25rem; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.45); }
  .bar { height:6px; background:linear-gradient(90deg,var(--primary),#EC4899); }
  .body { padding:2.5rem 1.75rem; text-align:center; }
  .mark { font-size:3rem; line-height:1; }
  .brand { font-size:.78rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  h1 { margin:.5rem 0 0; font-size:1.6rem; }
  p { margin:.9rem 0 0; color:var(--muted); font-size:.95rem; }
  .links { margin-top:1.6rem; display:flex; flex-direction:column; gap:.6rem; }
  .links a {
    display:block; padding:.85rem 1rem; border-radius:.8rem; text-decoration:none;
    background:#150E22; border:1px solid #2E2340; color:var(--text); font-weight:600; font-size:.95rem;
  }
  .links a:hover { border-color:var(--primary); }
  .stores { margin-top:1.6rem; display:flex; flex-wrap:wrap; justify-content:center; gap:.6rem; }
  .store {
    display:flex; align-items:center; gap:.65rem; padding:.6rem 1.1rem; min-width:11.5rem;
    border-radius:.8rem; text-decoration:none; text-align:left; line-height:1.15;
    background:#000; color:#fff; border:1px solid #4A3D5E;
  }
  .store svg { width:1.7rem; height:1.7rem; fill:currentColor; flex:none; }
  .store small { display:block; font-size:.68rem; opacity:.8; }
  .store b { display:block; font-size:1.1rem; font-weight:600; }
  a.store:hover { border-color:var(--primary); transform:translateY(-2px); }
  a.store { transition:transform .15s ease; }
  .store.pronto { opacity:.45; cursor:default; }
  footer { padding:0 1.75rem 1.75rem; text-align:center; font-size:.72rem; color:#6B6180; }
</style>
</head>
<body>
<div class="card">
  <div class="bar"></div>
  <div class="body">
    <div class="mark">&#127183;</div>
    <div class="brand">Preliados</div>
    <h1>El juego de cartas para previas</h1>
    <p>Desc&aacute;rgala gratis en la App Store. Google Play, muy pronto.</p>
    <div class="stores">
      <a class="store" href="https://apps.apple.com/es/app/preliados/id6801454491" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
        <span><small>Desc&aacute;rgalo en la</small><b>App Store</b></span>
      </a>
      <div class="store pronto" aria-disabled="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>
        <span><small>Muy pronto en</small><b>Google Play</b></span>
      </div>
    </div>
    <div class="links">
      <a href="/social">Redes sociales</a>
      <a href="/soporte">Ayuda y contacto</a>
      <a href="/cuenta">Gesti&oacute;n de cuenta</a>
      <a href="/legal/">Documentos legales</a>
      <a href="/legal/privacidad">Pol&iacute;tica de privacidad</a>
    </div>
  </div>
  <footer>Preliados &middot; Solo para mayores de 18 a&ntilde;os.</footer>
</div>
</body>
</html>
